AWSTemplateFormatVersion: '2010-09-09'
Description: Instaflow — Instagram Automation SaaS on AWS (EC2 + S3 + backups)

Parameters:
  DomainName:
    Type: String
    Description: Public domain name (e.g. instaflow.com)
    Default: ''
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, m5.large, m5.xlarge]
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
  GitRepo:
    Type: String
    Description: Git repository containing the Instaflow source
    Default: ''
  EnvSsmParameter:
    Type: String
    Description: SSM parameter holding the production .env file
    Default: /instaflow/prod/env

Resources:
  # ---------------------------------------------------------------- networking
  InstaflowVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: instaflow-vpc

  InstaflowInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: instaflow-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref InstaflowVpc
      InternetGatewayId: !Ref InstaflowInternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InstaflowVpc
      CidrBlock: 10.60.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: instaflow-public-a

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InstaflowVpc
      CidrBlock: 10.60.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: instaflow-private-a

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: VpcGatewayAttachment
    Properties:
      AllocationId: !GetAtt EipAllocation.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: instaflow-nat

  EipAllocation:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InstaflowVpc

  PrivateRoute:
    Type: AWS::EC2::Route
    DependsOn: NatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet

  # ------------------------------------------------------------------- storage
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'instaflow-assets-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'instaflow-backups-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # ------------------------------------------------------------- secrets / IAM
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: instaflow-s3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !GetAtt AssetsBucket.Arn
                  - !Sub '${AssetsBucket.Arn}/*'
                  - !GetAtt BackupBucket.Arn
                  - !Sub '${BackupBucket.Arn}/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: '*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # ---------------------------------------------------------------------- EC2
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Instaflow edge traffic (HTTP/HTTPS + SSH)
      VpcId: !Ref InstaflowVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH (restrict to your IP range)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: instaflow-web
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update -y
          apt-get install -y ca-certificates curl git unzip jq awscli
          curl -fsSL https://get.docker.com | sh
          systemctl enable --now docker
          usermod -aG docker ubuntu
          apt-get install -y docker-compose-plugin
          apt-get install -y mongodb-mongodb-org-shell || apt-get install -y mongodb-org-tools || true
          mkdir -p /opt/instaflow
          cd /opt/instaflow
          if [ -n "${GitRepo}" ]; then git clone ${GitRepo} .; fi
          aws ssm get-parameter-by-name --name ${EnvSsmParameter} \
            --with-decryption --query 'Parameter.Value' --output text > .env || cp .env.example .env
          chmod +x scripts/*.sh
          docker compose up -d --build
          echo "*/5 * * * * root /opt/instaflow/scripts/backup.sh >> /var/log/instaflow-backup.log 2>&1" \
            > /etc/cron.d/instaflow-backup
          chown root:root /etc/cron.d/instaflow-backup

  # ----------------------------------------------------------------- DNS/ACM
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      HostedZoneName: !Sub '${DomainName}.'
      HostedZoneConfig:
        Comment: Instaflow hosted zone

  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub '*.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub '*.${DomainName}'
          HostedZoneId: !Ref HostedZone

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub 'api.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebServer.PublicDnsName
        HostedZoneId: !GetAtt WebServer.HostedZoneId
        EvaluateTargetHealth: false

Outputs:
  InstanceId:
    Description: EC2 instance id
    Value: !Ref WebServer
  PublicDns:
    Description: Public DNS name of the web server
    Value: !GetAtt WebServer.PublicDnsName
  PublicIp:
    Description: Public IP of the web server
    Value: !GetAtt WebServer.PublicIp
  ApiDnsName:
    Description: API DNS name
    Value: !Sub 'api.${DomainName}'
  AssetsBucketName:
    Description: S3 bucket for uploads
    Value: !Ref AssetsBucket
  BackupBucketName:
    Description: S3 bucket for database backups
    Value: !Ref BackupBucket
  EnvParameterName:
    Description: SSM parameter holding the production .env
    Value: !Ref EnvSsmParameter
