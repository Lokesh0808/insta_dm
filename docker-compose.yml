# ==========================================================================
# Instaflow — Production Docker Compose
# Usage:  docker compose up -d --build
# ==========================================================================
name: instaflow

services:
  # ------------------------------------------------------------------------
  # MongoDB — persistent database
  # ------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: instaflow-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-instaflow}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - instaflow_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  # ------------------------------------------------------------------------
  # Redis — cache + BullMQ broker
  # ------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: instaflow-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - instaflow_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768m

  # ------------------------------------------------------------------------
  # Backend — Express + TypeScript API
  # ------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: instaflow-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB_NAME:-instaflow}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      API_URL: ${API_URL:-http://localhost/api}
      INTERNAL_CLIENT_URL: ${INTERNAL_CLIENT_URL:-http://frontend}
    ports:
      - "${BACKEND_PORT:-4000}:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - instaflow_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g

  # ------------------------------------------------------------------------
  # Frontend — built React SPA served by nginx
  # ------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: instaflow-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - instaflow_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------------
  # Nginx — edge reverse proxy + TLS termination
  # ------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: instaflow-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/00-instaflow-http.conf:/etc/nginx/conf.d/00-instaflow-http.conf:ro
      - ./nginx/conf.d/10-https.conf.template:/etc/nginx/templates/10-https.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - nginx_logs:/var/log/nginx
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - instaflow_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  backend_uploads:
  nginx_logs:
  certbot_certs:
  certbot_www:

networks:
  instaflow_net:
    driver: bridge
