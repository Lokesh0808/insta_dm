# ---------------------------------------------------------------------------
# HTTP edge — proxies to the API and the React SPA.
# When TLS certificates are available the entrypoint also renders an HTTPS
# server (see 10-https.conf.template) and this block redirects to it.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # ACME http-01 challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://instaflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # --- WebSocket ---------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://instaflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- SPA ---------------------------------------------------------------
    location / {
        proxy_pass http://instaflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets (long cache) ---------------------------------------
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        proxy_pass http://instaflow_frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
