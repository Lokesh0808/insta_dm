# ==========================================================================
# Instaflow — Development Docker Compose (override)
# Usage:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# ==========================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-4000}:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:4000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  mongodb:
    ports:
      - "${MONGO_PORT:-27017}:27017"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
